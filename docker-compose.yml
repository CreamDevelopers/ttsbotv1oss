services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50021' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VOICEVOX_URL: http://voicevox:50021
    volumes:
      - bot-data:/app/data
    depends_on:
      voicevox:
        condition: service_healthy

volumes:
  bot-data:
